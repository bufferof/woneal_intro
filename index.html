<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>
<style>
  :root{
    --bg:#0B0B0C;
    --text:#F2F2F0;
    --muted:#8A8A88;
    --line:rgba(255,255,255,0.1);
    --accent:#E8B44D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
  }
  a{color:inherit; text-decoration:none;}
  ul{list-style:none;}

  .wrap{max-width:760px; margin:0 auto; padding:0 24px;}

  section{padding:88px 0;}
  section + section{border-top:1px solid var(--line);}

  h1, h2{
    font-size:14px;
    font-weight:600;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:36px;
  }

  p{color:var(--muted); font-size:15px;}

  /* ===== HEADER ===== */
  header{padding:100px 0 60px;}
  header h1{
    font-size:32px;
    font-weight:700;
    color:var(--text);
    letter-spacing:-0.01em;
    text-transform:none;
    margin-bottom:8px;
  }
  header .role{color:var(--accent); font-size:15px; margin-bottom:20px;}
  header .bio{max-width:480px;}

  /* ===== EXPERIENCE ===== */
  .exp-item{
    display:flex;
    gap:24px;
    padding:18px 0;
    border-top:1px solid var(--line);
  }
  .exp-item:first-of-type{border-top:none;}
  .exp-year{
    flex:0 0 110px;
    font-size:13px;
    color:var(--muted);
  }
  .exp-role{font-size:15px; font-weight:600; margin-bottom:4px;}
  .exp-desc{font-size:14px;}
  .tag-current{
    display:inline-block;
    font-size:10px;
    font-weight:700;
    color:var(--bg);
    background:var(--accent);
    padding:2px 8px;
    border-radius:999px;
    margin-left:8px;
    vertical-align:middle;
  }

  /* ===== AWARDS ===== */
  .award-item{
    display:flex;
    justify-content:space-between;
    gap:16px;
    padding:14px 0;
    border-top:1px solid var(--line);
    font-size:14px;
  }
  .award-item:first-of-type{border-top:none;}
  .award-title{color:var(--text); font-weight:500;}
  .award-org{color:var(--muted); font-size:13px; margin-top:2px;}
  .award-year{color:var(--muted); font-size:13px; white-space:nowrap;}

  /* ===== PROJECTS ===== */
  .project-item{
    padding:24px 0;
    border-top:1px solid var(--line);
  }
  .project-item:first-of-type{border-top:none;}
  .project-title{font-size:16px; font-weight:600; color:var(--text); margin-bottom:6px;}
  .project-desc{font-size:14px; margin-bottom:12px;}
  .project-tags{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
  .project-tags span{
    font-size:11px;
    color:var(--muted);
    border:1px solid var(--line);
    padding:3px 9px;
    border-radius:999px;
  }
  .project-link{font-size:13px; color:var(--accent);}
  .project-link:hover{text-decoration:underline;}

  /* ===== CONTACT ===== */
  .contact-item{
    display:flex;
    justify-content:space-between;
    padding:14px 0;
    border-top:1px solid var(--line);
    font-size:14px;
  }
  .contact-item:first-of-type{border-top:none;}
  .contact-item span:first-child{color:var(--muted);}
  .contact-item a:hover{color:var(--accent);}

  footer{
    padding:40px 0;
    text-align:center;
    font-size:13px;
    color:var(--muted);
  }
</style>
</head>
<body>

  <div class="wrap">
    <header>
      <h1>정원일</h1>
      <div class="role">System Engineering</div>
      <p class="bio">시스템 엔지니어가 되기 위해 온프레미스와 클라우드를 공부하는 학생입니다.</p>
    </header>
  </div>

  <section>
    <div class="wrap">
      <h2>Experience</h2>
      <div id="experience-list"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2>Awards</h2>
      <div id="awards-list"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2>Projects</h2>
      <div id="projects-list"></div>
    </div>
  </section>

  <section>
    <div class="wrap">
      <h2>Contact</h2>
      <div id="contact-list"></div>

  <footer>&copy; 2026 정원일. All rights reserved.</footer>

        tags: ["Proxmox", "Grafana", "Prometheus", "UptimeKUMA", "AlertManager", "Discord Webhook", "Ubuntu"],

      },

    document.getElementById("experience-list").innerHTML = experience.map(e => `
      <div class="exp-item">
        <div class="exp-year">${e.year}</div>
        <div>
          <div class="exp-role">${e.role}${e.current ? '<span class="tag-current">Current</span>' : ''}</div>
          <div class="exp-desc">${e.desc}</div>

    document.getElementById("awards-list").innerHTML = awards.map(a => `
      <div class="award-item">
        <div>

    document.getElementById("projects-list").innerHTML = projects.map(p => `
      <div class="project-item">

        <div class="project-desc">${p.desc}</div>
        <div class="project-tags">${p.tags.map(t => `<span>${t}</span>`).join("")}</div>

    document.getElementById("contact-list").innerHTML = contact.map(c => `
      <div class="contact-item">
        <span>${c.label}</span>
        <a href="${c.href}" target="_blank" rel="noopener noreferrer">${c.value}</a>

  </script>

</body>
</html>
